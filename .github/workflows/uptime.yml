name: Uptime

# Cheap production heartbeat. The 2026-07 outage (prod pointed at the wrong
# Supabase project) broke every event/RSVP/lineup fetch and stayed broken
# because nothing was watching. This pings the live health + events
# endpoints on a schedule and fails the run - which emails the repo admins
# via GitHub's default Actions-failure notification - if either is down.
#
# Runs every 15 minutes. Also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Override with a repo/environment variable if the prod host ever changes.
env:
  BASE_URL: ${{ vars.PROD_BASE_URL || 'https://zaostock.com' }}
  # Optional: assert prod is talking to the expected Supabase project.
  # Set repo variable EXPECTED_DB_HOST to yjrlaxpjusmrfylumban.supabase.co
  # to make the wrong-database failure mode impossible to miss again.
  EXPECTED_DB_HOST: ${{ vars.EXPECTED_DB_HOST }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint
        run: |
          echo "GET $BASE_URL/api/health"
          body="$(curl -sS --max-time 20 --retry 2 --retry-delay 5 \
            -w '\nHTTP_STATUS:%{http_code}' "$BASE_URL/api/health")"
          echo "$body"
          status="$(printf '%s' "$body" | sed -n 's/.*HTTP_STATUS:\([0-9]*\)$/\1/p')"
          if [ "$status" != "200" ]; then
            echo "::error::/api/health returned HTTP $status (expected 200)"
            exit 1
          fi
          if [ -n "$EXPECTED_DB_HOST" ] && ! printf '%s' "$body" | grep -q "$EXPECTED_DB_HOST"; then
            echo "::error::/api/health is not reporting the expected DB host ($EXPECTED_DB_HOST)"
            exit 1
          fi

      - name: Public events endpoint
        run: |
          echo "GET $BASE_URL/api/events"
          status="$(curl -sS --max-time 20 --retry 2 --retry-delay 5 \
            -o /dev/null -w '%{http_code}' "$BASE_URL/api/events")"
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::/api/events returned HTTP $status (expected 200)"
            exit 1
          fi
