# Uptime check for the public API.
#
# Exists because of the 2026-07-16 outage: production was pointed at the wrong
# Supabase project, /api/events returned 500 for over a month, and nobody knew
# until someone went looking by hand. The forms had to come off (#48) as a
# downstream consequence. This is the cheap thing that would have caught it on
# day one.
#
# Two assertions, and the second matters as much as the first:
#   1. /api/events returns 200 with an `events` array.
#   2. That array is not empty.
# A wrong-but-reachable database answers 200 with an empty array. That is the
# exact shape of the failure this is meant to catch, so an empty roster counts
# as down.
#
# Caveats, so nobody trusts this further than it goes:
#   - GitHub disables scheduled workflows on a public repo after 60 days with
#     no commits. Check the Actions tab if the repo ever goes quiet that long.
#   - Cron here is best-effort; runs can be delayed or skipped under load.
#   - It notifies by opening an issue, not by waking anyone up. If Oct 3 needs
#     a real pager, this is not it.
name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/events
        id: check
        run: |
          set -uo pipefail
          URL="https://zaostock.com/api/events"
          BODY_FILE="$(mktemp)"
          CODE="$(curl -sS -m 30 -o "$BODY_FILE" -w '%{http_code}' "$URL" || echo 000)"
          BODY="$(head -c 2000 "$BODY_FILE")"

          echo "status: $CODE"
          echo "body: $BODY"

          FAIL=""
          if [ "$CODE" != "200" ]; then
            FAIL="HTTP $CODE from $URL"
          elif ! echo "$BODY" | jq -e '.events | type == "array"' >/dev/null 2>&1; then
            FAIL="200, but the response has no events array"
          elif [ "$(echo "$BODY" | jq '.events | length')" -eq 0 ]; then
            FAIL="200, but the events array is empty - usually means the wrong Supabase project is wired up"
          fi

          {
            echo "code=$CODE"
            echo "reason=$FAIL"
            echo "body<<BODY_EOF"
            echo "$BODY"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FAIL" ]; then
            echo "DOWN: $FAIL"
            exit 1
          fi
          echo "OK: $(echo "$BODY" | jq '.events | length') events"

      - name: Open an issue if it is down
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.check.outputs.reason }}
          CODE: ${{ steps.check.outputs.code }}
          RESPONSE: ${{ steps.check.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Uptime: /api/events is down"

          # One open issue at a time. A check that fires every 10 minutes must
          # never become 144 issues a day, and re-commenting on an outage
          # nobody has fixed yet adds nothing.
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')"
          if [ "$EXISTING" != "0" ]; then
            echo "Already tracked in an open issue. Not filing another."
            exit 0
          fi

          {
            printf '`https://zaostock.com/api/events` failed its scheduled check.\n\n'
            printf '**Reason:** %s\n' "$REASON"
            printf '**HTTP status:** %s\n\n' "$CODE"
            printf 'Response body:\n\n```json\n%s\n```\n\n' "$RESPONSE"
            printf 'Run: %s\n\n---\n\n' "$RUN_URL"
            printf 'Check the Supabase wiring first, since that is what broke last time.\n'
            printf '`NEXT_PUBLIC_SUPABASE_URL` on the Vercel `za-ostock` project (under the\n'
            printf "**thezao's projects** team) should resolve to \`yjrlaxpjusmrfylumban\`. If the\n"
            printf 'response above names `etwvzrmlxeobinrlytza`, that is the cowork tracker, not\n'
            printf 'the app database. See `docs/CANONICAL-REPO.md`.\n\n'
            printf 'Opened automatically. Close it once the check goes green; a new one opens if\n'
            printf 'the site goes down again.\n'
          } > issue-body.md

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md
