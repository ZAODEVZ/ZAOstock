name: Review comment

# HALF TWO OF THE AUTOMATED REVIEWER. It holds the key, so it never runs the
# PR's code: it checks out MAIN (this file and scripts/review come from main,
# never from the PR), downloads half one's artifact as untrusted data, asks
# two reviewers, and posts one comment. It cannot approve, request changes,
# merge or push. Zaal, 2026-09-27: "make sure on zaostock or any non zaal
# merge is very well reviewed".
#
# The PR number is looked up from the head SHA through the API rather than
# read from the artifact, because the artifact was written by the PR's code.
#
# Without the ANTHROPIC_API_KEY secret it posts nothing and says so in the log.

on:
  workflow_run:
    workflows: ["Review capture"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A step's own env is not visible to that step's `if`, so the key check
      # lives at job level.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: review-artifact
          path: review-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Find the PR from the head SHA, not from the artifact
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          n=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefOid \
                --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number" | head -1)
          if [ -z "$n" ]; then echo "no open PR has head $HEAD_SHA; nothing to review"; fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: Two reviewers
        if: steps.pr.outputs.number != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          ARTIFACT: review-artifact
          OUT: review.md
        run: node scripts/review/ai-review.mjs
      - name: Post the review as a comment
        if: steps.pr.outputs.number != '' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ steps.pr.outputs.number }}" -R "$GITHUB_REPOSITORY" --body-file review.md
