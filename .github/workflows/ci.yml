name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# LINT IS A SEPARATE JOB, AND THE REASON IS A REAL OUTAGE.
#
# On 2026-09-20 the ESLint 10 bump (#185) merged while red. Every step here
# used to live in ONE job, in order, so `npm run lint` exiting 2 meant `test`
# and `build` were reported as SKIPPED rather than run:
#
#     success  npm run typecheck
#     failure  npm run lint
#     skipped  npm run test      <- 431 tests did not execute
#     skipped  npm run build
#
# For nine minutes main reported red on every push while asserting nothing
# about correctness, and any genuine failure in that window would have been
# indistinguishable from the lint crash. A style check took the correctness
# gates offline with it.
#
# Two jobs means a lint failure can never hide a test failure again, and the
# checks list says which of the two broke without opening a log. The cost is
# one extra `npm ci`, which the npm cache makes cheap, and both jobs run in
# parallel so the wall clock does not move.
jobs:
  check:
    name: typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # End-to-end, doc 2504 (card 10079, 2026-10-06). Runs the Playwright specs in
  # e2e/ against THIS commit's build served on localhost - never the live site,
  # which is what playwright.config.ts defaults to when E2E_BASE_URL is unset.
  # No secrets: the checkout doors read site.ts constants and the backstage spec
  # only exercises the no-match 404. FAIL-SAFE by design: a server that never
  # answers, or a test list that comes back empty, fails this job with a loud
  # message instead of passing on zero tests.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: start the built site
        run: |
          nohup npx next start -H 127.0.0.1 -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$E2E_BASE_URL/"; then echo "server up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::e2e: the built site never answered on $E2E_BASE_URL within 60s - the specs did NOT run"
          cat next-start.log
          exit 1
      - name: refuse an empty test list
        run: |
          total=$(npx playwright test --list | grep -oE 'Total: [0-9]+' | grep -oE '[0-9]+' || true)
          echo "playwright lists ${total:-0} tests"
          if [ -z "$total" ] || [ "$total" -eq 0 ]; then
            echo "::error::e2e: playwright found no tests - refusing to pass on zero"
            exit 1
          fi
      - run: npm run test:e2e
      - if: failure()
        run: cat next-start.log || true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Its own job, same reasoning as the split above: this check's job is to
  # fail loudly and by itself, never to take typecheck/test/build down with
  # it if a page hardcodes a fact that's drifted from festival.ts/site.ts.
  facts:
    name: fact-dedup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:facts

  # Its own job: horizontal-overflow audit at real mobile viewports.
  #
  # WHY IT IS ITS OWN JOB, AND WHY IT BUILDS THE PULL REQUEST'S OWN CODE:
  # scripts/mobile-overflow-check.mjs already exists and works (real device
  # emulation, not a bare window size - see the header of that file for why
  # that distinction matters). It was simply never wired into CI, so nothing
  # ran it on any pull request. A check that nothing invokes guards nothing.
  #
  # It runs against `next start` on this build, NOT against zaostock.com.
  # Checking production would only ever report on production: a pull request
  # that introduces a 1400px element would stay green until after it merged,
  # which is the same lag this file's uptime workflow exists to avoid.
  #
  # `--max-warnings=0` is already the lint gate, so a new job here does not
  # have to repeat the "warnings must not pass silently" rule.
  mobile:
    name: mobile overflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Server and check share one step on purpose. A process backgrounded in
      # one `run:` step is not guaranteed to survive into the next one, and a
      # checker that silently never reaches the server would report PASS on
      # nothing - the exact failure mode this job exists to prevent. So: start,
      # prove the port answers, run the check, kill the server. If the server
      # does not come up, the step fails instead of passing silently.
      - name: Check for horizontal overflow on mobile
        run: |
          # Output goes to a file, not to the job log. A backgrounded process
          # keeps its stdout open, and a step that is still holding a pipe
          # never drains - the step hangs until the job is killed, which is how
          # a passing check turns into a red build. The log is still read if
          # the server fails to come up.
          npx next start --port 3111 > /tmp/next-start.log 2>&1 &
          server_pid=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3111/; then
              echo "server up after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "server did not come up on :3111" >&2
              cat /tmp/next-start.log >&2
              kill "$server_pid" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          status=0
          npm run check:mobile-overflow || status=$?
          kill "$server_pid" 2>/dev/null || true
          exit "$status"
        env:
          BASE: http://127.0.0.1:3111

  # Its own job: audits security and database invariants (Rule 9 red control,
  # Rule 7c pinned head SHA, credentials leaks, SQL injection, RLS boundaries).
  # Fails loudly on its own without hiding other CI assertions.
  review:
    name: security & database review gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:review
